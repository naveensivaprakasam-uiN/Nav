<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Figtree;src:url(assets/figtree.woff2) format('woff2');font-weight:300 900}
@font-face{font-family:CG;src:url(assets/cg500.woff2) format('woff2');font-weight:500}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden}
body{font-family:Figtree,Inter,system-ui,sans-serif;color:#18181b;background:#fbfbfa;font-size:12px;-webkit-font-smoothing:antialiased;position:relative}
svg.i{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;height:720px}
/* sidebar */
.sb{width:196px;flex:none;background:#f7f7f6;border-right:1px solid #ececea;display:flex;flex-direction:column;padding:10px 10px 8px;position:relative}
.sb .logo{display:flex;align-items:center;gap:7px;height:30px;padding:0 4px;font-weight:600;font-size:16px;letter-spacing:-.01em}
.sb .logo .col{margin-left:auto;color:#555}
.zl{width:24px;height:24px;border-radius:50%;background:linear-gradient(140deg,#4f8cff,#1d4ed8);display:grid;place-items:center;flex:none}
.zl svg{width:15px;height:15px}
.ws{display:flex;align-items:center;gap:8px;height:34px;padding:0 6px;margin-top:6px;font-size:12.5px}
.av{width:22px;height:22px;border-radius:50%;background:#ececec;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#444;flex:none}
.ws .chev{margin-left:auto;color:#666}
.create{margin:8px 0 12px;height:32px;border-radius:16px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500;font-size:12.5px}
.nav{display:flex;align-items:center;gap:9px;height:29px;padding:0 9px;border-radius:9px;font-size:12.5px;color:#1f1f22;margin-bottom:1px}
.nav .r{margin-left:auto;color:#777}
.nav.on{background:#ececea}
.sub{display:flex;align-items:center;height:27px;margin-left:24px;padding:0 10px;border-radius:8px;font-size:12px;color:#5c5c62;margin-bottom:1px}
.sub.on{background:#ececea;color:#18181b;font-weight:500}
.sb .user{margin-top:auto;display:flex;align-items:center;gap:8px;padding:6px 4px}
.sb .user b{font-weight:500;font-size:12px;display:block}
.sb .user span{font-size:10.5px;color:#777}
.sb .user .ud{margin-left:auto;color:#666}
/* rail (collapsed) */
.rail{width:52px;flex:none;background:#f7f7f6;border-right:1px solid #ececea;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px}
.rail .ri{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#2a2a2e}
.rail .ri svg.i{width:16px;height:16px}
.rail .plus{width:30px;height:30px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;margin:6px 0}
/* main */
.main{flex:1;position:relative;overflow:hidden}
.top{position:absolute;right:16px;top:9px;display:flex;align-items:center;gap:8px;z-index:3}
.credits{height:28px;border-radius:14px;background:#111;color:#fff;display:flex;align-items:center;gap:5px;padding:0 13px;font-size:11.5px;font-weight:600}
.credits svg{width:12px;height:12px;fill:#facc15;stroke:#facc15}
.circ{width:28px;height:28px;border-radius:50%;background:#f0f0ef;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#333}
.wrap{width:860px;margin:0 auto;padding-top:40px}
.h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
.muted{color:#6b6b72}
.card{background:#fff;border:1px solid #ececea;border-radius:12px}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:8px;border:1px solid #e6e6e4;background:#fff;font-size:11.5px;font-weight:500;color:#222}
.btn.dark{background:#111;color:#fff;border-color:#111}
.pill{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9px;font-size:9.5px;font-weight:600}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:6px;border:1px solid #e8e8e6;font-size:10px;font-weight:600;color:#555;background:#fff}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.scrim{position:absolute;inset:0;background:rgba(20,20,22,.42);z-index:5}
.modal{position:absolute;z-index:6;background:#f8f8f7;border-radius:14px;box-shadow:0 24px 60px -16px rgba(0,0,0,.35);overflow:hidden}
.chatbar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:520px;background:#fff;border:1px solid #e8e8e6;border-radius:14px;box-shadow:0 6px 20px -8px rgba(0,0,0,.15);padding:9px 12px;z-index:2}
.chatbar .in{display:flex;align-items:center;gap:8px;color:#888;font-size:11.5px}
.chatbar .chips{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:10px;color:#666}
.chatbar .chips span{border:1px solid #eee;border-radius:7px;padding:3px 7px;color:#333}
.sendc{width:24px;height:24px;border-radius:50%;background:#ddd;color:#fff;display:grid;place-items:center}
.sendc.dark{background:#111}
.sendc svg.i{width:13px;height:13px}
</style></head>

const I=(n,cls='')=>`<svg class="i ${cls}" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const LOGO=`<span class="zl"><svg viewBox="0 0 24 24"><path d="M13.6 5.3c2.4-1.6 4.6-2 6.4-1.8.2 1.8-.2 4-1.8 6.4l-4.6 4.6-4.6-4.6z" fill="#fff"/><path d="M9.6 9.3l-3.2-.2-2.2 2.4 3.6.8z M14.7 14.4l.2 3.2-2.4 2.2-.8-3.6z" fill="#fff"/><path d="M7.3 15.2c-1.6.3-2.7 1.6-3 3.8 2.2-.3 3.5-1.4 3.8-3z" fill="#fff"/></svg></span>`;

const SUBS={bb:['Overview','Signals','Sources','Skills'],ad:['Create','Apps','Library','Approvals','Activity'],bm:['Review Queue','Rules Engine','Agent Playbook','Action History','AI Researcher'],ci:['Social','Sub-Brands','Ratings','Mentions'],pm:['Overview','Goals','Connectors'],rep:['Dashboards','Reports','Alerts','Playbook']};
function sidebar(open,sub,topOn){
  let h=`<aside class="sb"><div class="logo">${LOGO}Zocket<span class="col">${I('cl')}</span></div>
  <div class="ws"><span class="av">D</span>Demo<span class="chev">${I('cd')}</span></div>
  <div class="create">${I('plus')}Create</div>`;
  for(const [k,l,ic] of NAV){
    const has=SUBS[k];
    h+=`<div class="nav ${(k===open&&has)||k===topOn?'on':''}" data-hit="nav-${k}">${I(ic)}${l}${has?`<span class="r">${I(k===open?'cd':'cr')}</span>`:''}</div>`;
    if(k===open&&has) SUBS[k].forEach(s=>h+=`<div class="sub ${s===sub?'on':''}" data-hit="sub-${k}-${s.toLowerCase().replace(/[^a-z]+/g,'-')}">${s}</div>`);
  }
  h+=`<div class="user"><span class="av">D</span><div><b>Demo user</b><span>demo@yourbrand.com</span></div><span class="ud">${I('cud')}</span></div></aside>`;
  return h;
}
function rail(){
  return `<aside class="rail">${LOGO}<div class="ri" style="margin-top:8px">${I('cr')}</div><div class="ri"><span class="av">D</span></div><div class="plus">${I('plus')}</div>
  ${[['home','home'],['tasks','tasks'],['bb','brain'],['ad','palette'],['bm','shield'],['ci','eye'],['pm','radio'],['rep','chart']].map(([k,ic])=>`<div class="ri" data-hit="rail-${k}">${I(ic)}</div>`).join('')}
  <div class="ri">${I('dots')}</div><div style="margin-top:auto;margin-bottom:12px"><span class="av">D</span></div></aside>`;
}

/* Brand Brain: sources */
const srcCard=(L,t,s,st,ago,warn)=>`<div class="card" style="padding:12px 13px;height:84px;display:flex;flex-direction:column;${warn?'border-color:#f3d79c':''}">

  ${sec('Brand presence',3,'Your owned social channels.')}
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">${srcCard('F','Facebook','API · facebook.com','live','45d ago')}${srcCard('I','Instagram','API · instagram.com','live','45d ago')}${srcCard('Y','YouTube','API · youtube.com','live','45d ago')}</div>
  ${sec('CRM',1,'Where moderated reviews become support cases.')}

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">${srcCard('U','Brand_Guidelines_2026.pdf','Upload · Document','live','8d ago')}${srcCard('U','Tone_of_Voice_Playbook.docx','Upload · Document','an','8d ago')}${srcCard('U','Category_Review_Memo.docx','Upload · Document','an','8d ago')}</div>
  </div></div>`;

const signal=(pl,pri,type,t,d,foot,hit)=>{const pc={MEDIUM:'#c2410c',HIGH:'#dc2626',LOW:'#2563eb'}[pri];const tc={Opportunities:['#e9f8ef','#15803d','⊕'],Critical:['#fdecec','#c22f35','⚠'],Warning:['#fff4e0','#b45309','⚠']}[type];const bar={MEDIUM:'#f59e0b',HIGH:'#dc2626',LOW:'#3b82f6'}[pri];

 <span class="btn dark" ${hit?`data-hit="${hit}"`:''} style="position:absolute;right:14px;top:12px;height:26px">${I('spark')}Analyse</span></div>`;};
